name: Deploy

# Deploys main to Cloud Run. Nothing reaches production any other way: a
# hand-run `gcloud run deploy` from a workstation leaves no record of which
# commit is live, which is how the fix in #2 sat merged and unshipped while
# production kept serving a build from an unrelated working copy.
#
# Provenance: the image is tagged with the commit SHA and the revision is
# labelled with it, so `gcloud run services describe` always answers
# "what code is running?".

on:
  push:
    branches: [main]
  workflow_dispatch:

# WIF only — no static service account keys.
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: mcp-wave
  REGION: us-central1
  SERVICE: gmail-mcp
  IMAGE_REPO: us-central1-docker.pkg.dev/mcp-wave/cloud-run-source-deploy/gmail-mcp

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lockfile:lint
      # Production dependencies only — that is what the runtime image contains.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Build & Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/616272664681/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-deployer@mcp-wave.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Built on the runner rather than with `gcloud builds submit`: that
      # command streams from Cloud Build's default logs bucket, which requires
      # project Viewer, so it exits non-zero on a build that actually
      # succeeded. Building here keeps the deploy service account narrow and
      # puts the full build log in the Actions run.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE_REPO:$GITHUB_SHA" .
          docker push "$IMAGE_REPO:$GITHUB_SHA"

      # Image only: env vars, secrets, scaling and args stay as configured on
      # the service. This workflow ships code, it does not own configuration.
      - name: Deploy revision
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_REPO:$GITHUB_SHA" \
            --labels "commit-sha=$GITHUB_SHA" \
            --quiet

      - name: Verify the revision is serving
        run: |
          url=$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --format='value(status.url)')
          # The OAuth metadata document is served by the app itself, so a valid
          # response proves the new revision is up and answering, not just that
          # the deploy API call returned.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$url/.well-known/oauth-authorization-server")
          echo "$url/.well-known/oauth-authorization-server -> $code"
          test "$code" = "200"
